name: UploadCloud

options:
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:

  # ── Container App ────────────────────────────────────────────
  UploadCloud:
    type: application
    platform: macOS
    sources:
      - path: UploadCloud
        type: group
      - path: Shared
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uploadcloud.app
        INFOPLIST_FILE: UploadCloud/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - target: UploadCloudExtension
        embed: true
        codeSign: true

  # ── FinderSync Extension ─────────────────────────────────────
  UploadCloudExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: UploadCloudExtension
        type: group
      - path: Shared
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uploadcloud.app.extension
        INFOPLIST_FILE: UploadCloudExtension/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: FinderSync.framework
